name: 🏥 医疗大模型论文日报

on:
  schedule:
    - cron: "30 0 * * *"   # 每天 UTC 00:30 = 北京时间 08:30
  workflow_dispatch:        # 支持手动触发 (Actions 页面 → Run workflow)

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取论文并生成日报
        run: python fetch_papers.py

      - name: 提交日报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "今日无更新"
          else
            git commit -m "📰 $(date -u +%F) 医疗大模型日报"
            git push
          fi
